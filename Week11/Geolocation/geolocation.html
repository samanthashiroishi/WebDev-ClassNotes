<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="">
  <title>Geolocation</title>

  <style>
 *  {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
 }

 body {
    font-family: Arial, Helvetica, sans-serif;
    max-width: 700px;
    margin: 40 px auto;
    padding: 0 20px;
    text-align: center;
    color: #1a1a1a;
 }

 h1 {
    margin-bottom: 8px;
 }

 .subtitle {
    color: #6b7280;
    margin-bottom: 32px;
 }

/* button styling */
button {
    background-color: #3b82f6;
    color: white;
    border: none;
    padding: 14px 28px;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 0.2s;
}

button:hover {
    background-color: #2563eb;
}

/* result box */
#result {
    margin-top: 24px;
    padding: 20px;
    background-color: #f3f4f6;
    border-radius: 8px;
    font-size: 18px;
    line-height: 1.6; /* like height of lines on a notebook*/
}

/* detail table, will display lat and longitude */
.details-table {
    margin: 20px auto 0; 
    text-align: left;
    border-collapse: collapse;
    width: 100%;
    max-width: 500px;
}

.details-table td { /* td: generic cell in an html table */
    padding: 8px 12px;
    border-bottom: 1px solid #e5e7eb;
}

.details-table td:first-child {
 font-weight: bold;
 color: #374151;
 width: 40%;
}
  </style>

</head>


<body>
    <h1>Where am I?</h1>
    <p class="subtitle">A live demo of the browsers Geolocation API</p>
    <button id="findMe">Find my location</button>
    <div id="result">Click the button to find your location</div>









    <script>
        // make this global so we can set it with one function and access it
        // in many others
        let result

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('findMe').addEventListener('click', findMe)
    result =document.getElementById('result')
})

const findMe = () => {
    // immediately giving the user feedback by updating the results div to 
    // tell the user location search is in progress
    result.textContent = 'Looking for your location now...'

    // check if the brower supports geolocation aka the navigator object exists and has geolocaiton
    // if it doesn't exist we check right away and exit out early with return after displaying a message to the user
    if(!('geolocation' in navigator)) {
        // if geolocation does not exist
        result.textContent = 'Sorry, your browser does not support Geolocation'
        return //nothing more can be done in this function, so lets return/exit out early
    }

    // if we made it to here, we have geolocation capabilities!
    // 1. request user's position (with a method/function built into navigator function in JavaScript in browser)
    // getCurrentPosition returns a position object on success
    // returns an error on error

//   const myObject =  {
//         key: 'value',
//         pets: ['snake', 'cat', 'dog']
//     }

navigator.geolocation.getCurrentPosition(onSuccess, onError)
}

// onSuccess receives data from getCurrentPosition, 
// we will name this data position in our function

const onSuccess = (position) => {
    console.log(position.coords.latitude, position.coords.longitude)

    const lat = position.coords.latitude
    const lon = position.coords.longitude
    const accuracy = position.coords.accuracy
    // only on mobile
    let altitude = position.coords.altitude;
    let speed = position.coords.speed;

    // build an HTML table to show the results with some nicer
    // formatting
    result.innerHTML = `

        <table class="details-table">
            <tr> 
                <th>Latitude:</th> 
                <td>${(lat)}</td>
            </tr>

            <tr> 
                <th>Longitude:</th> 
                <td>${(lon)}</td>
            </tr>

            <tr> 
                <th>Accuracy:</th> 
                <td>${Math.round(accuracy)} meters </td>
            </tr>


            <tr> 
                <th>Altitude:</th> 
                <td>${altitude != null ? Math.round(altitude) + 'meters' : 'Not Available'}</td>
            </tr>

            <tr> 
                <th>Speed:</th> 
                <td>${speed != null ? Math.round(speed) + 'meters/second' : 'Not Available'}</td>
             </tr>
        </table>
    `


}

const onError = (error) => {
    console.warn(`geolocation error: ${error.code}, ${error.message}`)
    result.textContent = `Unable to retrieve your location: ${error.message}`
}






    </script>
</body>
</html>
