<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" /> <!--ensures the fonts you use will show up-->
    <meta name="viewport" content="width=device-width, initial-scale=1" /> <!--ensure responsive designs show up correctly, like desktop vs mobile phone versions-->
    <title>Who is Cooking?!</title> <!--text in the blue Google search results-->
    <style>  
  /* internal style sheet */
      #top { 
        /* text color */
        color: red;   
      }
    </style>
  </head>
  <body>
 

    <h1>Who is Cooking?! (HW Form Practice)</h1> <!-- big heading -->

    <!-- ============================================================
         THE FORM GOES HERE. This is for homework

         We build it together, one fieldset at a time:

           1. Who is cooking?   text, email, password
           2. The recipe        text, number, range, select
           3. How hard is it?   radio    (one answer only)
           4. Dietary tags      checkbox (several answers)
           5. The actual food   textarea
           6. Extras            file, url, date, color
           7. Buttons           submit, reset

         Start with the <form> tag itself and its attributes, then add
         one fieldset at a time. Do not skip ahead -- the point is to
         watch what each input type does in the browser as we add it.
         ============================================================ -->


<!-- The form tag itself is not visible on the page. It wraps form elements
 and bakes in some browser default behavior. You can hit the enter key to submit
 a small form (clicking any button inside the form will submit the form)  -->

<!-- Target will be _self by default, but you can still type it out
 
GET to retrieve data, POST to write to a database or send data to a restful API endpoint
 PUT to edit or update an existing entry in the database, DELETE deletes a record from the database
 
 Action is another optional attribute, it's usually the endopoint or script to digest the form data
 -->
<form name="contactUs" target="_self" method="POST">

<fieldset>
<!-- legend is the title of the form group/fieldset -->

<legend>Who is cooking?</legend>
<p>
Let us know who you are!
</p>

<!-- label for, id, and name need to match; required is a boolean, if true it needs to be there, if false then no need to put it at all-->
<label for="firstName">First Name:</label>
<input type="text" id="firstName" name="firstName" required placeholder="First Name..."/>

<br />
<br />

<label for="lastName">Last Name:</label>
<input type="text" id="lastName" name="lastName" required placeholder="Last Name..." maxlength="20"/>

<br />
<br />

<label for="age">Age:</label>
<input type="number" id="age" name="age" min="1" max="120" required/>

<br />
<br />

<label for="email">Email:</label>
<input name="email" id="email" type="email" required/>

<br />
<br />

<label for="password">Password:</label>
<input name="password" id="password" type="password" required />

<br />
<br />

<label for="userBio">Bio:</label>
<textarea name="userBio" id="userBio" rows="4" cols="50" placeholder="Tell us about yourself" required></textarea>
</fieldset>


<!-- text, number, range, select
 text: give us the name of your recipe and briefly describe it
 number: how many servings is it for
 range: how long does it take to make
 select: dietary restrictions (use checkbox) -->
<fieldset>
<legend>The Recipe</legend>

<br />
<br />

<label for="recipeInfo">Recipe Name:</label>
<textarea name="recipeInfo" id="RecipeInfo" rows="1" cols="40" placeholder="Give us the name of your recipe" required></textarea>

    <br />
    <br />

<label for="servings">Servings:</label>
<input type="number" id="servings" name="servings"  min="1" max="30" required/>

    <br />
    <br />

<label for="spicy">How spicy is it?</label>
<input type="range" name="spicy" id="spicy" min="1" max="10" value="5">

 <br />
 <br />

<label for="dietary">What kind of recipe is it?</label> 

 <br />

<label><input type="checkbox" name="dietary" id="dietary" value="Breakfast" />Breakfast</label>
<label><input type="checkbox" name="dietary" id="dietary" value="Lunch" />Lunch</label>
<label><input type="checkbox" name="dietary" id="dietary" value="Dinner" />Dinner</label>
<label><input type="checkbox" name="dietary" id="dietary" value="Dessert" />Dessert</label>
<label><input type="checkbox" name="dietary" id="dietary" value="Snack" />Snack</label>
</fieldset>



<!--  3. How hard is it?   radio    (one answer only) -->
<fieldset>
<legend>How hard is it?</legend>

<br />
<br />

<label for="difficulty">On a scale from 1 to 5, how difficult is your recipe?</label> <br />
<!-- when you copy paste checkbox or radio groups, make sure you update the label (user sees) and the 
 value (what gets submitted to the database) -->

<br />
<br />

<label><input type="radio" name="difficulty" id="difficulty" value="1" />1</label>
<label><input type="radio" name="difficulty" id="difficulty" value="2" />2</label>
<label><input type="radio" name="difficulty" id="difficulty" value="3" />3</label>
<label><input type="radio" name="difficulty" id="difficulty" value="4" />4</label>
<label><input type="radio" name="difficulty" id="difficulty" value="5" />5</label>

<br />
<br />

</fieldset>


<!-- 4. Dietary tags      checkbox (several answers) -->
<fieldset>
<legend>Dietary Tags</legend>

<br />
<br />

<label for="dietary">Does your recipe apply to these dietary restrictions?</label> 

 <br />
  <br />

<label><input type="checkbox" name="dietary" id="dietary" value="Vegeterian" />Vegeterian</label>
<label><input type="checkbox" name="dietary" id="dietary" value="Pescaterian" />Pescaterian</label>
<label><input type="checkbox" name="dietary" id="dietary" value="Vegan" />Vegan</label>
<label><input type="checkbox" name="dietary" id="dietary" value="Gluten Free" />Gluten Free</label>
<label><input type="checkbox" name="dietary" id="dietary" value="Keto" />Keto</label>

 <br />
  <br />

</fieldset>


<!-- 5. The actual food   textarea -->
<fieldset>
<legend>The Actual Food</legend>

    <br />
    <br />

<label for="recipeInfo">What makes your recipe special?</label>
<textarea name="recipeInfo" id="RecipeInfo" rows="4" cols="100" placeholder="Describe what makes it special!"></textarea>

    <br />
    <br />

</fieldset>

<!-- 6. Extras            file, url, date, color -->
<fieldset>
<legend>Extras</legend>

    <br />
    <br />

<label>Upload a photo of your food!</label>
<input type="file" accept="image/*">

    <br />
    <br />

<label for="url">Paste your recipe URL here:</label>
<textarea name="url" id="url" rows="1" cols="50" placeholder="Paste URL"></textarea>

    <br />
    <br />

<label for="date">Choose a date you last made your recipe:</label>
<input type="date" id="date">



<!-- color -->
 <label for="color">Choose a color for your cookbook:</label>
<input type="color" name="color" id="color">
</fieldset>



<button type="submit">Add to the cookbook</button>
<button type="reset">Start over</button>

</form>

    <p><a href="#top">Back to Top</a></p>
  </body>
</html>
